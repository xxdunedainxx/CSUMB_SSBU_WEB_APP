name: Backend CI (Python)

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
        
